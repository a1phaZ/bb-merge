services:
  caddy:
    image: ghcr.io/a1phaz/bb-merge-caddy:latest
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - caddy-data:/data
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: ghcr.io/a1phaz/bb-merge-app:latest
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STORAGE_TYPE=${STORAGE_TYPE:-sqlite}
      - DATA_DIR=/app/data
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - TZ=${TZ:-UTC}
    volumes:
      - app-data:/app/data
      - app-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  app-data:
  app-logs:
  caddy-data:

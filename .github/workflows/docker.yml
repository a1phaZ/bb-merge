name: Build & Push Docker

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/a1phaz/bb-merge-app
  CADDY_IMAGE: ghcr.io/a1phaz/bb-merge-caddy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}

      - name: Build and push caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          target: caddy
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:${{ github.sha }}
